<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>larp linux (x86_64)</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&display=swap');

        :root {
    --bg-color: #000;
    --tui-green: #16c60c;
    --tui-blue: #61d6d6;
    --tui-text: #ffffff;
    --tui-muted: #aaaaaa;
    --tui-alert: #e74856;
}
        body {
            margin: 0;
            padding: 0;
            font-family: 'JetBrains Mono', monospace;
            background-color: var(--bg-color);
            color: var(--tui-text);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            font-size: 14px;
        }

        * {
            scrollbar-width: none;
        }
        ::-webkit-scrollbar {
            display: none;
        }

        header {
            padding: 10px 16px 5px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            user-select: none;
        }

        .title-prompt {
            color: var(--tui-green);
            font-weight: 700;
        }

        .ascii-divider {
            color: var(--tui-muted);
            letter-spacing: -1px;
            overflow: hidden;
            white-space: nowrap;
            padding: 0 16px;
            user-select: none;
        }

        #workspace-wrapper {
            flex: 1;
            display: flex;
            flex-direction: column;
            padding: 10px 16px 16px 16px;
            height: calc(100vh - 55px);
            box-sizing: border-box;
            gap: 12px;
            overflow-y: hidden;
        }

        /* Top row layout containment for Side-by-Side windows */
        #top-row {
            display: flex;
            gap: 12px;
            flex: none;
        }

        #dynamic-workspace {
            flex: 1;
            display: grid;
            gap: 12px;
        }

        .layout-grid {
            grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
            grid-auto-rows: 1fr;
        }

        .tile {
            display: flex;
            flex-direction: column;
            overflow: hidden;
            position: relative;
            border: 1px solid var(--tui-muted);
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .tui-top-bar {
            white-space: nowrap;
            overflow: hidden;
            display: flex;
            user-select: none;
            line-height: 1.2;
            background-color: var(--bg-color);
            padding: 6px 12px;
            border-bottom: 1px dashed var(--tui-muted);
        }

        .tui-title-bracket {
            color: var(--tui-muted);
        }

        .tui-title {
            color: var(--tui-blue);
            font-weight: bold;
        }

        .tui-content-wrapper {
            flex: 1;
            display: flex;
            overflow: hidden;
            padding: 8px; 
            box-sizing: border-box;
            background-color: var(--bg-color);
        }

        .tile-frame {
            flex: 1;
            border: none;
            background: transparent;
            width: 100%;
            height: 100%;
            overflow: hidden;
        }

        .status-msg {
            margin: auto;
            text-align: center;
            color: var(--tui-text);
            max-width: 500px;
            border: 1px dashed var(--tui-muted);
            padding: 20px;
        }
    </style>
</head>
<body>

    <header>
        <div class="title-prompt">you@larplinux:/$ about && xterm</div>
    </header>

    <div class="ascii-divider"></div>

    <main id="workspace-wrapper">
        <div class="status-msg" id="status"><br><br></div>
        <!-- Row wrapper ensuring side-by-side positioning -->
        <div id="top-row"></div>
        <div id="dynamic-workspace" class="layout-grid"></div>
    </main>

    <script>
        const TUI_PAGES = [
            { file: 'about.html',    label: 'about',    layoutZone: 'top', height: '300px', maxWidth: '500px' },
            { file: 'projects.html', label: 'projects', layoutZone: 'top', height: '300px' },
            { file: 'terminal.html', label: 'terminal', layoutZone: 'main' }
        ];

        const wrapper = document.getElementById('workspace-wrapper');
        const topRow = document.getElementById('top-row');
        const dynamicWorkspace = document.getElementById('dynamic-workspace');
        const statusMsg = document.getElementById('status');
        const divider = document.querySelector('.ascii-divider');

        divider.textContent = '─'.repeat(window.innerWidth / 8);
        window.addEventListener('resize', () => {
            divider.textContent = '─'.repeat(window.innerWidth / 8);
        });

        window.addEventListener('DOMContentLoaded', () => {
            if (!TUI_PAGES || TUI_PAGES.length === 0) {
                statusMsg.innerHTML = "[ ERROR ]<br><br>The configuration manifest array <code>TUI_PAGES</code> is empty.";
                return;
            }

            statusMsg.style.display = 'none';

            TUI_PAGES.forEach(page => {
                const targetURL = `./pages/${page.file}`;
                const titleLabel = page.label || page.file; 
                
                const tile = createTuiTile(titleLabel, targetURL, page.height, page.maxWidth);

                if (page.layoutZone === 'top') {
                    topRow.appendChild(tile);
                } else {
                    dynamicWorkspace.appendChild(tile);
                }
            });
        });

        function createTuiTile(fileName, url, customHeight, maxWidth) {
            const tile = document.createElement('div');
            tile.className = 'tile';
            
            if (customHeight) {
                tile.style.height = customHeight;
                tile.style.maxHeight = customHeight;
            }
            
            if (maxWidth) {
                tile.style.maxWidth = maxWidth;
                tile.style.flex = `0 0 ${maxWidth}`; // Enforce strict sizing rule
            } else {
                tile.style.flex = "1"; // Auto-grow sibling windows horizontally
            }

            const topBar = document.createElement('div');
            topBar.className = 'tui-top-bar';
            topBar.innerHTML = `<span class="tui-title-bracket">[ </span><span class="tui-title">${fileName}</span><span class="tui-title-bracket"> ]</span>`;

            const wrapperStructure = document.createElement('div');
            wrapperStructure.className = 'tui-content-wrapper';

            const iframe = document.createElement('iframe');
            iframe.className = 'tile-frame';
            iframe.src = url;
            iframe.scrolling = "no"; 
            iframe.sandbox = "allow-scripts allow-same-origin allow-popups allow-popups-to-escape-sandbox";

            wrapperStructure.appendChild(iframe);

            tile.appendChild(topBar);
            tile.appendChild(wrapperStructure);
            
            return tile;
        }
    </script>
</body>
</html>
